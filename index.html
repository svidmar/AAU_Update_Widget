<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2632, height=1222">
    <meta http-equiv="refresh" content="3600">
    <title>AAU Update News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 2632px;
            height: 1222px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #e8e8e8;
        }

        .header {
            background: #211a52;
            color: white;
            padding: 20px 30px;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            width: 2632px;
            height: calc(1222px - 76px);
        }

        .article {
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            background: #333;
        }

        /* First two articles are large (each spans 2 columns) */
        .article:nth-child(1),
        .article:nth-child(2) {
            grid-column: span 2;
        }

        .article img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .article-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 70px 25px 25px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: white;
        }

        /* Large articles (1st and 2nd) */
        .article:nth-child(1) .article-overlay,
        .article:nth-child(2) .article-overlay {
            padding: 90px 35px 35px;
        }

        .article-title {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* Large articles get bigger titles */
        .article:nth-child(1) .article-title,
        .article:nth-child(2) .article-title {
            font-size: 44px;
            line-height: 1.15;
        }

        .article a {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
    </style>
</head>
